services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge_gym_health
    ports:
      - '5432:5432'
    volumes:
      - forge-gym-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U forge -d forge_gym_health']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  forge-gym-postgres:
